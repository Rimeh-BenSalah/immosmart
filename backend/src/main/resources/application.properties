spring.application.name=immosmart
server.port=${SERVER_PORT:8081}

# ===== Base MySQL =====
# Les valeurs après ':' sont celles du développement local (XAMPP, root, sans mot de passe).
# En Docker / en test, on les remplace par des variables d'environnement : aucun secret dans Git.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:immosmart}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=LOCAL&tinyInt1isBit=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Angular
app.cors-origin=${CORS_ORIGIN:http://localhost:4200}

# Clé qui signe le cookie de connexion
app.secret=${APP_SECRET}

# Dossier des photos (écrites et servies par la même application)
app.uploads-dir=${UPLOADS_DIR:uploads}
app.public-uploads-url=${PUBLIC_UPLOADS_URL:http://localhost:8081/uploads/}

# Upload de photos
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JPA : les tables existent déjà, Hibernate ne les modifie jamais
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# JSON en snake_case (mot_de_passe, nombre_pieces, ...) comme l'attend Angular
spring.jackson.property-naming-strategy=SNAKE_CASE

# Version de l application
app.version=${APP_VERSION:1.0.0}
