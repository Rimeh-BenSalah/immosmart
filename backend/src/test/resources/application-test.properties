# Profil "test" : s'ajoute à application.properties pendant les tests
spring.datasource.url=jdbc:h2:mem:immosmart;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

# Valeur factice, uniquement pour les tests
app.secret=secret-de-test-sans-valeur-reelle
