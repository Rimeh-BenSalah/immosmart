<div class="layout">
  <aside class="sidebar">
    
    <!-- LOGO -->
    <div class="logo">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <div class="logo-text">
        <h2>ImmoSmart</h2>
        <span class="role">Administration</span>
      </div>
    </div>

    <!-- MENU -->
    <nav>
      <!--<span class="nav-section">Menu principal</span>-->
      <!--routerLink:Elle définit la route vers laquelle l'utilisateur sera dirigé-->
      <!--routerLinkActive : permet de reconnaître visuellement le lien correspondant à la page actuelle
        active : c'est simplement le nom de la classe CSS utilisée pour appliquer le style-->
      <a routerLink="/admin/dashboard" routerLinkActive="active">
        <span class="icon">
          <!-- Création d'une icône SVG -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <!-- Premier rectangle : situé en haut à gauche -->
            <rect x="3" y="3" width="7" height="9"/>

            <!-- Deuxième rectangle : situé en haut à droite -->
            <rect x="14" y="3" width="7" height="5"/>

            <!-- Troisième rectangle : situé en bas à droite -->
            <rect x="14" y="12" width="7" height="9"/>

            <!-- Quatrième rectangle : situé en bas à gauche -->
            <rect x="3" y="16" width="7" height="5"/>
          </svg>
        </span>
        <span>Tableau de bord</span>
      </a>
      
      <a routerLink="/admin/users" routerLinkActive="active">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <!-- Dessine le corps du premier utilisateur -->
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>

            <!-- Dessine la tête du premier utilisateur sous forme de cercle -->
            <circle cx="9" cy="7" r="4"/>

            <!-- Dessine le corps du deuxième utilisateur -->
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>

            <!-- Dessine la tête du deuxième utilisateur -->
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </span>
        <span>Utilisateurs</span>
      </a>
      
      <a routerLink="/admin/annonces" routerLinkActive="active">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </span>
        <span>Annonces</span>
      </a>
      
      <a routerLink="/admin/categories" routerLinkActive="active">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
        </span>
        <span>Catégories</span>
      </a>
      
      <a routerLink="/admin/regions" routerLinkActive="active">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </span>
        <span>Régions</span>
      </a>
    </nav>

    <!-- DÉCONNEXION -->
    <button (click)="deconnexion()">
      <span class="icon">
      </span>
      <span>Déconnexion</span>
    </button>

  </aside>

 <!-- Balise main : représente le contenu principal de l'application -->
<main class="content">

    <!-- router-outlet : directive Angular qui sert d'emplacement
         pour afficher dynamiquement le composant correspondant
         à la route actuellement sélectionnée -->
    <router-outlet></router-outlet>

</main>
</div>
