<div class="regions-page">

  <h1>Gestion des régions</h1>

  <!-- Formulaire ajout -->
  <div class="form">
    <input [(ngModel)]="nouveauNom" placeholder="Nom région">
    <button (click)="ajouter()">Ajouter</button>
  </div>

  <!-- Tableau -->
  <table>
    <thead>
      <tr>
        <th>Nom</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of regions">
        <td class="name">{{ r.nom }}</td>
        <td>
          <button class="action-btn btn-warning" (click)="modifier(r)">Modifier</button>
          <button class="action-btn btn-danger" (click)="supprimer(r.id)">Supprimer</button>
        </td>
      </tr>
      <tr *ngIf="!regions.length">
        <td colspan="2" class="empty">Aucune région</td>
      </tr>
    </tbody>
  </table>

</div>
