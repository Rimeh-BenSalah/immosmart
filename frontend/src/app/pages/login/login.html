<div class="auth-page">
  
  <!-- BOÎTE DE CONNEXION -->
  <div class="box-brutal">
    
    <div class="breadcrumb">
      <a routerLink="/accueil" class="breadcrumb-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Accueil
      </a>
      <span class="breadcrumb-separator">›</span>
      <span class="breadcrumb-current">Connexion</span>
    </div>

    <h1>Connexion</h1>
    
    <div class="input-group">
      <!--[(ngModel)] est une directive Angular qui permet de lier un champ HTML à une variable TypeScript ,on appelle ça la liaison bidirectionnelle-->
      <input [(ngModel)]="email" placeholder="Email" type="email">
    </div>
    <div class="input-group">
      <input [(ngModel)]="mot_de_passe" placeholder="Mot de passe" type="password">
    </div>
    
    <button class="btn-brutal" (click)="seConnecter()">Se connecter</button>
    
    <p class="error" *ngIf="erreur">{{ erreur }}</p>
    
    <p class="link">Vous n'avez pas de compte ? <a routerLink="/register">Inscrivez-vous</a></p>
  </div>
</div>
