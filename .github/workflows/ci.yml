name: ImmoSmart CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests Backend et Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      # Tests Backend
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Executer les tests Backend
        run: mvn -B test
        working-directory: backend

      # Tests Frontend
      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances Frontend
        run: npm ci
        working-directory: frontend

      - name: Executer les tests Frontend
        run: |
          set -o pipefail
          npm test -- --watch=false --browsers=ChromeHeadless 2>&1 | tee frontend-test.log
        working-directory: frontend

      # Sauvegarder les rapports meme si les tests echouent
      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            backend/target/surefire-reports/
            frontend/frontend-test.log
          if-no-files-found: warn
          retention-days: 7

  build-images:
    name: Construction des images Docker
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Construire image Backend
        run: |
          docker build -t immosmart-backend:${{ github.sha }} ./backend

      - name: Construire image Frontend
        run: |
          docker build -t immosmart-frontend:${{ github.sha }} ./frontend
